schema_version = "1.0.0"
id = "blendlocation"
version = "0.2.0"
name = "BlendLocation"
tagline = "Import real elevation terrain into a local Blender site"
maintainer = "Coasterpete"
type = "add-on"
website = "https://github.com/Coasterpete/BlendLocation"
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-only"]

[permissions]
network = "Download elevation and map preview imagery"
files = "Cache elevation and map preview imagery"

[build]
paths = ["__init__.py", "geo.py", "terrarium.py", "providers.py", "terrain.py", "operators.py", "ui.py", "picker.py", "map_math.py", "map_imagery.py", "geocoding.py", "fixtures/hill.png"]
